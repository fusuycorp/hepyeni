name: Build, Push and Deploy Titirek

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/titirek
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Cloudflare (fronting registry.bogazici.app) enforces a 100MB
          # request-body limit; without forced max-compression a Next.js
          # standalone image layer can exceed that on push.
          outputs: type=image,push=true,compression=gzip,compression-level=9,force-compression=true

  deploy:
    name: Trigger Dokploy Redeployment
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Stack Redeployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL || 'https://dokploy.bogazici.app' }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY || secrets.DOKPLOY_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID || 'JaE0kGmEj-XgCSnA4ArFW' }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::DOKPLOY_API_KEY (or DOKPLOY_KEY) secret is not configured in organization or repository secrets."
            exit 1
          fi
          echo "Triggering Dokploy redeployment for Compose ID: $DOKPLOY_COMPOSE_ID at $DOKPLOY_URL..."

          # Attempt 1: Standard REST API (/api/compose.redeploy)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/compose.redeploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Dokploy redeployment triggered successfully via REST API! (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 0
          fi

          echo "Attempt 1 returned HTTP $HTTP_CODE: $BODY"
          echo "Attempt 2: Trying tRPC wrapped payload format..."

          # Attempt 2: tRPC Wrapped Payload Format
          TRPC_RESP=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/compose.redeploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"json\": {\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}}")

          TRPC_CODE=$(echo "$TRPC_RESP" | tail -n 1)
          TRPC_BODY=$(echo "$TRPC_RESP" | sed '$d')

          if [ "$TRPC_CODE" -ge 200 ] && [ "$TRPC_CODE" -lt 300 ]; then
            echo "✅ Dokploy redeployment triggered successfully via tRPC API! (HTTP $TRPC_CODE)"
            echo "$TRPC_BODY"
            exit 0
          fi

          echo "Attempt 2 returned HTTP $TRPC_CODE: $TRPC_BODY"
          echo "::error::All Dokploy API attempts failed."
          echo "REST API (HTTP $HTTP_CODE): $BODY"
          echo "tRPC API (HTTP $TRPC_CODE): $TRPC_BODY"
          exit 1
