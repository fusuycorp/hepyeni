name: Build & Push PocketBase Image

# Deliberately no redeploy step here, unlike deploy.yml — the compose
# stack (services/titirek/docker-stack.yml in the deployment repo) bundles
# both the titirek and pocketbase images into one coordinated
# compose.redeploy, triggered separately once both images exist and the
# stack config is ready. This workflow only builds/pushes the image, so
# it's safe to dispatch from any branch without side effects on
# production.
on:
  push:
    branches:
      - main
    paths:
      - 'pb_migrations/**'
      - 'Dockerfile.pocketbase'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push PocketBase Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/titirek-pb
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.pocketbase
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true,compression=gzip,compression-level=9,force-compression=true
