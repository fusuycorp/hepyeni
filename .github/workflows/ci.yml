name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    # GitHub-hosted on purpose, and this must not change while the repo is
    # public: `pull_request` fires for forks, so self-hosting this job runs
    # untrusted PR code as devhax inside the private network — `bun install`
    # honours a PR-supplied lockfile and `bun test` runs PR-supplied test
    # files, with docker-group access to the daemon and a 10.34.0.0/24
    # foothold beside the production Swarm nodes. Hosted minutes are free for
    # public repos, and the builder is still used by deploy.yml, which is
    # reachable only from push-to-main and workflow_dispatch.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test

      # next build generates .next/types, which a standalone `tsc --noEmit`
      # needs to resolve route-level types (e.g. LayoutProps); otherwise the
      # typecheck reports a phantom error on fresh checkouts.
      # Plain `bun next build` (no `--bun`): forcing Bun's runtime makes the
      # `next` child die with SIGILL on GitHub-hosted runners under the pinned
      # bun-version 1.3.14. The `--bun` rationale referenced src/db/index.ts,
      # which no longer exists, and nothing under src/ imports from "bun".
      # Do NOT append `; test -f ...` as a crash gate here: GitHub's default
      # `bash -e` aborts on the signal exit before the gate can run.
      - name: Production Build
        run: bun next build

      - name: Typecheck
        run: bun x tsc --noEmit

  lint:
    name: lint
    # GitHub-hosted for the same fork-safety reason as `test` above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
