name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    # GitHub-hosted on purpose, and this must not change while the repo is
    # public: `pull_request` fires for forks, and untrusted PR code must never
    # execute on the self-hosted builder (OCocuk) — that host holds the
    # registry credentials production pulls images with, so a fork PR running
    # there could push a poisoned `latest`. Hosted minutes are free for public
    # repos; the builder is reserved for deploy.yml (push to main / dispatch).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test

      # next build generates .next/types, which a standalone `tsc --noEmit`
      # needs to resolve route-level types (e.g. LayoutProps); otherwise the
      # typecheck reports a phantom error on fresh checkouts.
      # Bun 1.3.14 segfaults on exit after a successful build (same quirk
      # the Dockerfile works around) — gate on the artifact, not the exit.
      - name: Production Build
        run: bun --bun next build; test -f .next/standalone/server.js

      - name: Typecheck
        run: bun x tsc --noEmit

  lint:
    name: lint
    # GitHub-hosted for the same fork-safety reason as `test` above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
