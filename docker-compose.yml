services:
  hepyeni:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hepyeni
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PB_URL=${PB_URL:-http://localhost:8090}
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - TRUST_FORWARDED_HEADERS=${TRUST_FORWARDED_HEADERS:-0}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - FLAG_ENABLE_LLM_EXTRACT=${FLAG_ENABLE_LLM_EXTRACT:-false}
      - LLM_API_URL=${LLM_API_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_HOURLY_REQUEST_LIMIT=${LLM_HOURLY_REQUEST_LIMIT:-5}
      - LLM_HOURLY_COST_LIMIT=${LLM_HOURLY_COST_LIMIT:-120000}
    networks:
      - hepyeni-network

networks:
  hepyeni-network:
    driver: bridge
